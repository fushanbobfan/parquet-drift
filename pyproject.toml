[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "parquet-drift"
version = "0.1.0"
description = "Locate schema drift across every shard in a Parquet dataset"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "bobfan" }]
keywords = ["parquet", "schema", "data-engineering", "ci"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Database",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["pyarrow>=14"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "jsonschema>=4.23",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.9",
]

[project.scripts]
parquet-drift = "parquet_drift.cli:entrypoint"

[project.urls]
Homepage = "https://github.com/fushanbobfan/parquet-drift"
Issues = "https://github.com/fushanbobfan/parquet-drift/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/parquet_drift"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
